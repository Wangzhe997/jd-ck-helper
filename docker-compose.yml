services:
  jd-ck-helper:
    build: .
    image: jd-ck-helper:latest
    container_name: jd-ck-helper
    restart: unless-stopped
    # iStoreOS/OpenWrt 上推荐 host 网络：可直接访问宿主机上的青龙面板
    network_mode: host
    # 所有配置从同目录的 .env 读取（首次使用：cp .env.example .env 然后编辑）
    environment:
      - QL_URL=${QL_URL:-http://127.0.0.1:5700}
      - QL_CLIENT_ID=${QL_CLIENT_ID:-}
      - QL_CLIENT_SECRET=${QL_CLIENT_SECRET:-}
      - ENV_NAME=${ENV_NAME:-JD_COOKIE}
      - MODE=${MODE:-multi}
      - PORT=${PORT:-8787}
      - BIND_HOST=${BIND_HOST:-0.0.0.0}
      # 登录保护：推荐直接在页面「安全设置」里设置用户名和密码，
      # 凭据保存在下面的 data 卷里（auth.json），重建容器不丢、可在页面修改。
      # 下面两项仅用于「首次启动自动导入初始凭据」，留空=不启用。
      - ACCESS_USERNAME=${ACCESS_USERNAME:-admin}
      - ACCESS_PASSWORD=${ACCESS_PASSWORD:-}
      - DATA_DIR=/data
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      # 登录凭据持久化目录（./data 内含 auth.json，已在 .gitignore 中排除）
      - ./data:/data
