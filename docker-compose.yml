services:
  jd-ck-helper:
    build: .
    image: jd-ck-helper:latest
    container_name: jd-ck-helper
    restart: unless-stopped
    # iStoreOS/OpenWrt 上推荐 host 网络：可直接访问宿主机上的青龙面板
    network_mode: host
    # 所有配置从同目录的 .env 读取（首次使用：cp .env.example .env 然后编辑）
    environment:
      - QL_URL=${QL_URL:-http://127.0.0.1:5700}
      - QL_CLIENT_ID=${QL_CLIENT_ID:-}
      - QL_CLIENT_SECRET=${QL_CLIENT_SECRET:-}
      - ENV_NAME=${ENV_NAME:-JD_COOKIE}
      - MODE=${MODE:-multi}
      - PORT=${PORT:-8787}
      - BIND_HOST=${BIND_HOST:-0.0.0.0}
      - TZ=${TZ:-Asia/Shanghai}
